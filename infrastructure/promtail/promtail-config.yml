server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover and scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as the label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Extract environment (prod/uat) from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-(prod|uat)$'
        target_label: 'environment'
      # Use compose service as app label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Use compose project as project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

  # System logs
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog

  # Auth logs (sshd, fail2ban, pam — Ubuntu writes these to auth.log, not syslog)
  - job_name: authlog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/auth.log

  # Nginx access/error logs (written to host filesystem, not Docker stdout)
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          service: nginx
          __path__: /var/log/nginx/*.log
