[defaults]
inventory             = inventory/hosts.yml
roles_path            = ./roles
# Galaxy collections are baked into the runner image at /opt/galaxy;
# the image sets ANSIBLE_COLLECTIONS_PATHS. Local runs outside the
# container fall back to the default search path.
host_key_checking     = False
stdout_callback       = yaml
callbacks_enabled     = profile_tasks
forks                 = 5
retry_files_enabled   = False
interpreter_python    = auto_silent
deprecation_warnings  = True

[ssh_connection]
pipelining            = True
# StrictHostKeyChecking=accept-new + UserKnownHostsFile=/dev/null: accept
# any unknown host on first contact (TOFU) but never try to persist it,
# since we bind-mount ~/.ssh read-only into the container.
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
