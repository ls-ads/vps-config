name: Deploy via Ansible

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ansible --limit target (all, uat, prod, or a host name)'
        required: false
        default: 'all'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate required secrets
        id: check
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::SSH_PRIVATE_KEY secret is missing; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.check.outputs.skip == 'false'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Ansible
        if: steps.check.outputs.skip == 'false'
        run: |
          python -m pip install --quiet \
            ansible==9.5.1 \
            passlib cryptography jmespath docker
          ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections

      # --- Secrets handling ----------------------------------------------
      # Two supported patterns, choose one (or both — first match wins):
      #
      #   (a) ansible-vault — commit an encrypted secrets.yml to the repo;
      #       store the vault password in the ANSIBLE_VAULT_PASSWORD secret.
      #   (b) raw paste — store the full contents of secrets.yml as the
      #       RAW_SECRETS_YML secret; CI writes it to disk unencrypted
      #       and deletes it after the job.
      #
      # Inventory + group_vars are expected IN THE REPO (private fork can
      # un-ignore them; the public template gitignores them by default).

      - name: Write vault password file (if using ansible-vault)
        if: steps.check.outputs.skip == 'false' && env.VAULT_PW != ''
        env:
          VAULT_PW: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PW" > "$HOME/.vault_pass"
          chmod 600 "$HOME/.vault_pass"

      - name: Write raw secrets.yml (if not using ansible-vault)
        if: steps.check.outputs.skip == 'false' && env.RAW_SECRETS != ''
        env:
          RAW_SECRETS: ${{ secrets.RAW_SECRETS_YML }}
        run: |
          printf '%s' "$RAW_SECRETS" > secrets.yml
          chmod 600 secrets.yml

      - name: Run site.yml
        if: steps.check.outputs.skip == 'false'
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' && '~/.vault_pass' || '' }}
        run: ansible-playbook playbooks/site.yml --limit "${{ github.event.inputs.limit || 'all' }}"
