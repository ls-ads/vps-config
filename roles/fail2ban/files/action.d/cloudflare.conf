# Push fail2ban bans to a Cloudflare zone's IP Access Rules so the
# offender is blocked at the CF edge. Reads zone ID + API token from
# the env file passed via the `envfile` action parameter (one file per
# zone). A single jail can declare multiple cloudflare[...] invocations,
# each with a different envfile + actname — bans then fan out to every
# configured zone.
#
# Required token scope: Zone:Firewall Services:Edit on the zone whose
# ID is configured in the env file.

[Definition]
actionstart =
actionstop =
actioncheck =

actionban = . <envfile> && \
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/firewall/access_rules/rules" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"mode\":\"block\",\"configuration\":{\"target\":\"ip\",\"value\":\"<ip>\"},\"notes\":\"fail2ban: <name>\"}" \
              > /dev/null

actionunban = . <envfile> && \
              ID=$(curl -fsS \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                | jq -r '.result[0].id // empty') && \
              if [ -n "$ID" ]; then \
                  curl -fsS -X DELETE \
                    "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/firewall/access_rules/rules/${ID}" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    > /dev/null; \
              fi

[Init]
envfile = /etc/fail2ban/cloudflare-default.env
