---
# Per-zone cert issuance — called with loop_var `zone` set to an entry
# from cloudflare_zones. Reads the zone's CF API token from vault via
# `zone.dns_vault_key`.

- name: "[{{ zone.label }}] Reset zone_domains accumulator"
  set_fact:
    zone_domains: []

- name: "[{{ zone.label }}] Collect ssl.conf domains under .{{ zone.apex }}"
  set_fact:
    zone_domains: "{{ zone_domains + [item] }}"
  loop: "{{ ssl_domains }}"
  when: >-
    item == zone.apex
    or item.endswith('.' + zone.apex)
    or item == ('*.' + zone.apex)
    or item.endswith('.*.' + zone.apex)

- name: "[{{ zone.label }}] Compute primary (first non-wildcard domain for this zone)"
  set_fact:
    zone_primary: >-
      {{
        (zone_domains | reject('match', '^\\*\\.') | list | first)
        | default(zone_domains | first | regex_replace('^\\*\\.', ''), true)
      }}
  when: zone_domains | length > 0

- name: "[{{ zone.label }}] Record primary → lineage mapping for nginx"
  set_fact:
    zone_primary_domains: "{{ zone_primary_domains | default({}) | combine({zone.label: zone_primary}) }}"
  when: zone_domains | length > 0

- name: "[{{ zone.label }}] Skip: no ssl.conf domains match .{{ zone.apex }}"
  debug:
    msg: "No ssl.conf entries under .{{ zone.apex }} — skipping this zone."
  when: zone_domains | length == 0

- name: "[{{ zone.label }}] Write Cloudflare credentials file"
  copy:
    dest: "{{ letsencrypt_dir }}/cloudflare-{{ zone.label }}.ini"
    content: |
      # Managed by Ansible — do not edit by hand.
      dns_cloudflare_api_token = {{ lookup('vars', zone.dns_vault_key) }}
    owner: root
    group: root
    mode: "0600"
  when: zone_domains | length > 0
  no_log: true

# --- Wipe + run certbot ----------------------------------------------------
# certbot refuses to write into an existing /etc/letsencrypt/live/<primary>/
# unless it already manages the lineage (renewal/<primary>.conf present).
# Pre-wipe any unmanaged dir so a previous run's placeholder doesn't block.

- name: "[{{ zone.label }}] Check if a real Let's Encrypt cert exists at the canonical lineage path"
  shell: |
    set -e
    [ -f {{ letsencrypt_dir }}/live/{{ zone_primary }}/fullchain.pem ] || exit 1
    openssl x509 -in {{ letsencrypt_dir }}/live/{{ zone_primary }}/fullchain.pem -noout -issuer 2>/dev/null | grep -q "Let's Encrypt"
  register: real_cert_present
  changed_when: false
  failed_when: false
  when: zone_domains | length > 0

- name: "[{{ zone.label }}] Wipe placeholder + orphan suffixed lineages (no real LE cert at canonical path)"
  shell: |
    set -e
    rm -rf {{ letsencrypt_dir }}/live/{{ zone_primary }}
    rm -rf {{ letsencrypt_dir }}/live/{{ zone_primary }}-*
    rm -f  {{ letsencrypt_dir }}/renewal/{{ zone_primary }}.conf
    rm -f  {{ letsencrypt_dir }}/renewal/{{ zone_primary }}-*.conf
    rm -rf {{ letsencrypt_dir }}/archive/{{ zone_primary }}
    rm -rf {{ letsencrypt_dir }}/archive/{{ zone_primary }}-*
  when:
    - zone_domains | length > 0
    - real_cert_present.rc != 0
  changed_when: true

- name: "[{{ zone.label }}] Run certbot (DNS-01 via Cloudflare API)"
  command: >-
    certbot certonly
      --non-interactive --agree-tos
      --email {{ admin_email }}
      --dns-cloudflare
      --dns-cloudflare-credentials {{ letsencrypt_dir }}/cloudflare-{{ zone.label }}.ini
      --dns-cloudflare-propagation-seconds 30
      --cert-name {{ zone_primary }}
      {% for d in zone_domains %}-d {{ d | quote }} {% endfor %}
      --key-type rsa
      --expand
  when: zone_domains | length > 0
  register: certbot_result
  changed_when: "'Congratulations' in certbot_result.stdout or 'Successfully received certificate' in certbot_result.stdout"
  failed_when: false
  notify: reload nginx

# --- Placeholder fallback if certbot didn't write a cert ------------------

- name: "[{{ zone.label }}] Check post-certbot live cert existence"
  stat:
    path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/fullchain.pem"
  register: post_certbot_cert
  when: zone_domains | length > 0

- name: "[{{ zone.label }}] Write self-signed placeholder (certbot failed and no real cert)"
  block:
    - name: "[{{ zone.label }}] Ensure live/ directory"
      file:
        path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "[{{ zone.label }}] Generate placeholder private key"
      community.crypto.openssl_privatekey:
        path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/privkey.pem"
        size: 2048
        mode: "0600"

    - name: "[{{ zone.label }}] Generate placeholder CSR"
      community.crypto.openssl_csr:
        path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/placeholder.csr"
        privatekey_path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/privkey.pem"
        common_name: "{{ zone_primary }}"
        subject_alt_name:
          - "DNS:{{ zone_primary }}"
        mode: "0600"

    - name: "[{{ zone.label }}] Generate placeholder self-signed cert"
      community.crypto.x509_certificate:
        path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/fullchain.pem"
        privatekey_path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/privkey.pem"
        csr_path: "{{ letsencrypt_dir }}/live/{{ zone_primary }}/placeholder.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ placeholder_cert_days }}d"
        mode: "0644"
  when:
    - zone_domains | length > 0
    - certbot_result.rc | default(0) != 0
    - not post_certbot_cert.stat.exists

- name: "[{{ zone.label }}] Surface certbot output on failure"
  debug:
    msg: |
      certbot did not issue a real cert for zone '{{ zone.label }}':
      {{ certbot_result.stdout | default('') }}
      {{ certbot_result.stderr | default('') }}
      A self-signed placeholder at {{ letsencrypt_dir }}/live/{{ zone_primary }}/
      keeps nginx serving (with a browser warning) until the next successful
      certbot run.
  when:
    - zone_domains | length > 0
    - certbot_result.rc is defined
    - certbot_result.rc != 0
