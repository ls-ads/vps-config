---
# cloudflare_dns role defaults.

# Optional list of additional A / CNAME / TXT records to maintain
# alongside the auto-derived ones (apps, ops endpoints, ssh.<env>).
# Each entry is a dict; same shape the role uses internally:
#
#   - domain:  <zone apex — must match a name in `domains`>
#     name:    <FQDN>
#     type:    A | CNAME | TXT | MX | ...
#     content: <target>
#     proxied: true | false      # ignored for non-A/AAAA/CNAME
#     comment: "<optional note>" # surfaced in the CF dashboard
#
# Place env-agnostic records (external MX, verification TXT, SPF/DKIM)
# in group_vars/all.yml. Place env-specific records — anything whose
# `content` references `ansible_host` or `tailscale_ip` — in
# group_vars/prod.yml or group_vars/uat.yml; otherwise the last VM to
# run overwrites the others' record.
dns_extra_records: []

# Marker stamped on every record this role manages. Used to identify
# our records when listing the zone (CF surfaces it in the dashboard
# under each record's "Comment" field).
cloudflare_dns_managed_marker: "managed by ansible (cloudflare_dns role)"
