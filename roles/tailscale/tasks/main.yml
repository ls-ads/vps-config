---
# tailscale role — install, authenticate, expose tailscale0 IP as a
# host fact for nginx + ssl roles to use.

# --- Install --------------------------------------------------------------

- name: Check whether the tailscale binary is already installed
  command: which tailscale
  register: tailscale_bin
  changed_when: false
  failed_when: false

- name: Install Tailscale apt signing key
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  when: tailscale_bin.rc != 0

- name: Install Tailscale apt source list
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
  when: tailscale_bin.rc != 0

- name: Install Tailscale package
  apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is enabled and running
  service:
    name: tailscaled
    state: started
    enabled: true

# --- Authenticate ---------------------------------------------------------

- name: Query current Tailscale backend state
  command: tailscale status --json
  register: tailscale_state
  changed_when: false
  failed_when: false

- name: Determine current tailnet name (strip the magic-DNS suffix)
  set_fact:
    current_tailnet_name: >-
      {{
        ((tailscale_state.stdout | from_json).Self.DNSName | default('')).split('.')[0]
      }}
  when: tailscale_state.rc == 0

- name: Compute whether re-auth is needed
  set_fact:
    needs_tailscale_auth: >-
      {{
        tailscale_state.rc != 0
        or (tailscale_state.stdout | from_json).BackendState | default('') != 'Running'
        or (current_tailnet_name | default('')) != tailscale_hostname
      }}

# --- Reclaim hostname (optional) -----------------------------------------
# When this VM has just been rebuilt, the previous machine entry in the
# tailnet keeps the canonical hostname (e.g. uat-vm) and Tailscale assigns
# the new node an incremented name (uat-vm-1). To avoid that, we use the
# Tailscale Admin API to delete any device whose `hostname` matches ours
# before we authenticate. Skipped if `tailscale_api_key` is empty — in
# that case rebuilds will increment hostnames and you'll need to manually
# delete the offline device from the admin panel.
#
# Mint an API access token at https://login.tailscale.com/admin/settings/keys
# (type: "API access" — distinct from the auth key used for `tailscale up`).

- name: Log out before re-auth so the API delete + tailscale up can claim the canonical name
  command: tailscale logout
  when:
    - needs_tailscale_auth
    - (tailscale_state.stdout | from_json).BackendState | default('') == 'Running'
  changed_when: true

- name: Reclaim tailnet hostname before re-auth (delete stale devices)
  when:
    - needs_tailscale_auth
    - tailscale_api_key | default('') | length > 0
  block:
    - name: List existing Tailscale devices in tailnet
      uri:
        url: "https://api.tailscale.com/api/v2/tailnet/-/devices"
        headers:
          Authorization: "Bearer {{ tailscale_api_key }}"
        return_content: true
      register: ts_devices_response
      delegate_to: localhost
      become: false
      no_log: true

    - name: Delete any device matching our hostname (frees the canonical name)
      uri:
        url: "https://api.tailscale.com/api/v2/device/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ tailscale_api_key }}"
        status_code: [200, 404]
      loop: "{{ ts_devices_response.json.devices | default([]) | selectattr('hostname', 'equalto', tailscale_hostname) | list }}"
      loop_control:
        label: "{{ item.id }} (name={{ item.name }}, last seen {{ item.lastSeen | default('?') }})"
      delegate_to: localhost
      become: false

- name: Authenticate to tailnet (first run / re-auth only)
  command: >
    tailscale up
      --authkey={{ tailscale_auth_key }}
      --hostname={{ tailscale_hostname }}
      --accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}
      --ssh={{ tailscale_ssh | ternary('true', 'false') }}
  when: needs_tailscale_auth
  no_log: true

# --- Expose tailscale0 IPv4 as a host fact --------------------------------

- name: Read tailscale0 IPv4 address
  command: tailscale ip -4
  register: tailscale_ip_lookup
  changed_when: false

- name: Set tailscale_ip fact (cacheable — nginx + ssl + cloudflare_dns roles rely on it)
  set_fact:
    tailscale_ip: "{{ tailscale_ip_lookup.stdout_lines[0] }}"
    cacheable: true

- name: Show this VM's Tailscale IP
  debug:
    msg: "tailscale0 IP for {{ inventory_hostname }} ({{ env }}): {{ tailscale_ip }} — DNS records pointing here are managed by the cloudflare_dns role."
