worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    # 16m is a sensible global ceiling — most app upload paths are
    # well under this. Apps that need a different value can override
    # `client_max_body_size` in their per-server block. Setting too
    # generous a value at http {} lets oversized bodies reach the
    # upstream, which usually responds with a 500 rather than the
    # 413 nginx would have returned at the edge.
    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Suppress nginx version in `Server:` header — small info-disclosure
    # win, no functional change. Pairs with the global security-header
    # block below.
    server_tokens off;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling deliberately disabled. Let's Encrypt retired its
    # OCSP responder in mid-2024 (it wasn't replaced; LE recommends
    # disabling stapling rather than using a different responder).
    # With it on, every reload logs:
    #   "ssl_stapling" ignored, no OCSP responder URL in the certificate
    # which is harmless but noisy. Off avoids the noise without losing
    # any real functionality. If a future cert authority issues with
    # OCSP URLs, re-enable per-server.
    ssl_stapling off;

    # Rate limiting zones — per-server blocks use `limit_req zone=general`.
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ops:10m     rate=30r/s;

    # Proxy cache for SvelteKit's hashed-asset routes (per-app vhosts
    # opt in via `app.serve_immutable_assets: true`). Files under
    # /_app/immutable/* are content-addressed and immutable, so a
    # 1-yr cache on disk is safe — the first request from any client
    # warms the cache, every subsequent request is served by nginx
    # without ever waking the upstream Node process. levels=1:2 +
    # 100MB cap is enough for typical SvelteKit builds (assets are
    # small + few). max_size grows the cache; inactive purges on idle.
    proxy_cache_path /var/cache/nginx/assets
        levels=1:2
        keys_zone=assets:10m
        max_size=100m
        inactive=30d
        use_temp_path=off;

    # Security headers are set per-server, NOT here. Reason: when an
    # `add_header` exists at any level (server / location), nginx
    # silently ignores all `add_header` directives at outer levels — and
    # the upstream apps' own headers (set by SvelteKit hooks for the
    # webapp paths) already cover them. Adding the same headers globally
    # here caused duplicate / conflicting values on app responses
    # (notably X-Frame-Options DENY vs SAMEORIGIN). Ops-tool server
    # blocks set their own copies; app server blocks defer entirely to
    # the upstream.

    # Per-site configs (ops tools + per-app blocks are dropped in here
    # by the ansible roles).
    include /etc/nginx/conf.d/*.conf;
}
