---
# apps role — loops over `apps` from group_vars/all.yml (optionally
# filtered by `apps_filter`) and deploys each. Per-app tasks live in
# deploy_app.yml.

- name: Resolve app list (all or filtered)
  set_fact:
    apps_to_deploy: >-
      {{
        (apps_filter | length > 0)
          | ternary(
              apps | selectattr('name', 'in', apps_filter) | list,
              apps
            )
      }}

- name: Deploy each app
  include_tasks: deploy_app.yml
  loop: "{{ apps_to_deploy }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"

# Flush handlers (nginx reload, in particular) BEFORE the smoke test
# runs. Otherwise an nginx vhost change goes to disk during deploy_app
# but doesn't take effect in nginx until end-of-play — and the smoke
# test runs first, fails because nginx is still serving the old
# config, and ansible bails before handlers fire. Net result: bad
# config persists until a manual restart. Flushing here guarantees
# nginx is serving the new vhost when the smoke test hits it.
- name: Flush handlers (nginx reload) so smoke test sees the new vhosts
  meta: flush_handlers

# --- Post-deploy smoke test ----------------------------------------
# Hit each just-deployed app at its canonical HTTPS edge from the
# Ansible controller (not the VM), so the path under test is the
# same one a real user / external webhook traverses:
#   DNS → (Cloudflare on prod, Tailscale on private envs) → nginx → app
#
# Accepts any non-5xx response. 200/301/302 cover frontend routes;
# 401/403 cover auth-gated routes; 404 covers backends with no `/`
# handler. Anything 5xx or a connection error fails the play loudly —
# this catches a bad image push, a missing env var, an nginx vhost
# typo, or a container that came up but wedged before binding.
#
# Retries 6 × 5s so the container has up to 30s after
# `docker compose up -d` to actually be serving. Past that, the
# deploy is broken.

- name: "Smoke test: every deployed app responds non-5xx at its HTTPS edge"
  uri:
    url: "https://{{ ((app.subdomain ~ '.') if (app.subdomain is defined and app.subdomain) else '') }}{{ env_prefix }}{{ app.base_domain }}/"
    method: GET
    status_code: [200, 301, 302, 401, 403, 404]
    return_content: false
    timeout: 10
  delegate_to: localhost
  become: false
  loop: "{{ apps_to_deploy }}"
  loop_control:
    loop_var: app
    label: "{{ ((app.subdomain ~ '.') if (app.subdomain is defined and app.subdomain) else '') }}{{ env_prefix }}{{ app.base_domain }}"
  register: smoke_results
  retries: 6
  delay: 5
  until: smoke_results is succeeded
  # On failure ansible dumps the loop's `item` (the entire app dict
  # including the `env` block, which references secrets.yml values
  # via Jinja that are already resolved by this point). no_log
  # suppresses that dump. The status code, URL, and stderr from the
  # uri module still surface in the human-readable PLAY RECAP.
  no_log: true
